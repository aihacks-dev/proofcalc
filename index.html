<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f14"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Proof Sets Buy">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet" href="styles.css"/>
<title>Proof Sets Buy Sheet</title>
</head>

<body>

<header class="topbar">
<div>
<div class="title">Proof Sets Buy Sheet</div>
<div class="subtitle">Spot-based offer calculator</div>
</div>
<div id="versionLabel" class="version">v3</div>
</header>

<main class="container">

<section class="card">

<div class="row two">

<label class="field">
<span>Silver spot</span>
<input id="spotInput" type="number" step="0.01">
</label>

<div class="field">
<span>Buy discount</span>
<div class="slider-row">
<input id="discountSlider" type="range" min="0" max="50" step="0.5">
<div class="pill"><span id="discountLabel">35%</span></div>
</div>
</div>

</div>

<div class="row three">
<button id="resetBtn" class="btn secondary">Reset</button>
<button id="saveBtn" class="btn">Save Quote</button>
<button id="clearSavedBtn" class="btn danger">Clear Saved</button>
</div>

</section>

<section class="card">

<div class="card-title">Buy Buckets</div>
<div id="buckets"></div>

<div class="totals">

<div class="tot-row">
<div class="tot-label">Grand total offer</div>
<div id="grandTotal" class="tot-value">$0.00</div>
</div>

<div class="behind-wrap">

<button id="grandBehindToggle" class="behind-toggle">
Behind scenes ▸
</button>

<div id="grandBehindPanel" class="behind-panel hidden">

<div class="kv">
<div class="k">Total expected sell</div>
<div id="grandExpectedSell" class="v">$0.00</div>
</div>

<div class="kv">
<div class="k">Total profit</div>
<div id="grandProfit" class="v">$0.00</div>
</div>

</div>

</div>

</div>

</section>

<section class="card">
<div class="card-title">Saved Quotes</div>
<div id="savedList"></div>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
